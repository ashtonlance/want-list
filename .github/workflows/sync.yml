name: Daily card sync
# Refreshes catalog.json and prices.json from TCGplayer data (via tcgcsv.com) every day,
# with each card's artist from TCGdex, and adds the day's prices to prices-history.json.
on:
  schedule:
    - cron: "30 21 * * *" # 21:30 UTC, after tcgcsv's daily update
  workflow_dispatch:
  push:
    paths:
      - tools/sync.mjs
      - tools/artists.mjs
      - tools/lib/**
      - .github/workflows/sync.yml
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild catalog and prices
        run: node tools/sync.mjs
      - name: Check the result
        run: |
          node -e 'const c=require("./catalog.json"),p=require("./prices.json"),h=require("./prices-history.json");const d=h.days.indexOf(c.asOf);if(d<0||!Object.values(h.items).some(s=>Object.values(s).some(v=>v[d]!=null)))process.exit(1);if(!c.cards.length||!c.sets.length)process.exit(1);console.log(c.asOf,c.sets.length,"sets",c.cards.length,"cards",Object.keys(p.items).length,"prices",h.days.length,"days of history")'
          git diff --stat
      - name: Publish (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git add catalog.json prices.json prices-history.json tools/cache/artist-sets.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily card sync $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
