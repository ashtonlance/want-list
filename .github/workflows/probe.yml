name: probe
on: { push: { branches: [probe-rec] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST https://api.tcgdex.net/v2/graphql -H 'content-type: application/json' -d '{"query":"{ cards(pagination:{page:1,itemsPerPage:3}) { id illustrator variants_detailed { thirdParty { tcgplayer } } } }"}' | head -c 800; echo
          curl -s -X POST https://api.tcgdex.net/v2/graphql -H 'content-type: application/json' -d '{"query":"{ cards(pagination:{page:1,itemsPerPage:3}) { id illustrator } }"}' | head -c 800; echo
          curl -s https://api.tcgdex.net/v2/en/sets | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d), sum(s['cardCount']['total'] for s in d), d[-1])"
          curl -s https://api.tcgdex.net/v2/ja/sets | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d), sum(s['cardCount']['total'] for s in d), d[-1])"
          curl -s https://api.tcgdex.net/v2/ja/sets/SV2a | head -c 400; echo
          curl -s https://api.tcgdex.net/v2/ja/cards/SV2a-201 | head -c 1200; echo
          curl -s https://api.tcgdex.net/v2/en/cards/base1-4 | head -c 1500; echo
          curl -s https://api.tcgdex.net/v2/en/cards/swsh7-215 | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('illustrator'), [v.get('thirdParty') for v in d.get('variants_detailed',[])], d.get('pricing',{}).keys() if d.get('pricing') else None)"
          time (for i in $(seq -w 1 40); do curl -s -o /dev/null https://api.tcgdex.net/v2/en/cards/sv03-0$i & done; wait)
          curl -s "https://api.tcgdex.net/v2/en/cards?illustrator=eq:HYOGONOSUKE&pagination:itemsPerPage=3" | head -c 400; echo
