name: probe
on: { push: { branches: [probe-rec] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://tcgcsv.com/tcgplayer/3/24380/products | python3 -c "
          import json,sys;d=json.load(sys.stdin)['results']
          names=set()
          for x in d:
            for e in x['extendedData']: names.add(e['name'])
          print(sorted(names))
          print(json.dumps(d[40])[:1500])"
          curl -s https://tcgcsv.com/tcgplayer/85/groups | head -c 300; echo
          curl -s https://api.tcgdex.net/v2/en/cards/me01-001 | head -c 2500; echo
          curl -s "https://api.tcgdex.net/v2/en/sets/me01" | head -c 800; echo
          curl -sI https://tcgplayer-cdn.tcgplayer.com/product/726512_200w.jpg | head -5
          curl -s https://api.pokemontcg.io/v2/cards/sv1-1 | head -c 1500; echo
          nproc
