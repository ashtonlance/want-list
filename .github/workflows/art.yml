name: Art fingerprints
# Builds art.bin, a small picture fingerprint of every card worth suggesting, so For You picks can
# favour cards that look like a collection's cards. Runs after each daily card sync and only embeds
# the cards that are new; the first run backfills everything (see tools/art/embed.mjs).
on:
  workflow_run:
    workflows: ["Daily card sync"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    paths:
      - tools/art/**
      - tools/lib/**
      - .github/workflows/art.yml
permissions:
  contents: write
  # To start a deploy after publishing a new art.bin.
  actions: write
concurrency:
  group: art
  cancel-in-progress: false
jobs:
  art:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/art/package-lock.json
      - run: npm ci --prefix tools/art
      - uses: actions/cache@v4
        with:
          path: .models
          key: clip-vit-base-patch32-v1
      - name: Embed new cards
        run: node tools/art/embed.mjs
        env:
          HF_CACHE_DIR: .models
          ART_BUDGET_MINUTES: "70"
      - name: Keep the result for review (branches)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: art
          path: |
            art.bin
            tools/art/pca.bin
          retention-days: 3
      - name: Publish (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git add art.bin tools/art/pca.bin
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Art fingerprints $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
          # A push with the Actions token starts no workflows, so ask for the deploy directly.
          gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
